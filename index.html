      const [selectedKeywords, setSelectedKeywords] = useState(["Pelatihan guru", "Kemitraan pendidikan", "Pendidikan terjangkau"]);

      // State Output & UI
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState("");
      const [beritaHasil, setBeritaHasil] = useState("");
      const [auditHasil, setAuditHasil] = useState(null);
      const [deduksiHasil, setDeduksiHasil] = useState(null);
      const [copied, setCopied] = useState(false);

      // Toggle kriteria aktif/nonaktif
      const toggleKriteria = (key) => {
        setKriteria(prev => ({
          ...prev,
          [key]: { ...prev[key], aktif: !prev[key].aktif }
        }));
      };

      // Update nilai kriteria spesifik
      const updateKriteriaValue = (key, field, value) => {
        setKriteria(prev => ({
          ...prev,
          [key]: { ...prev[key], [field]: value }
        }));
      };

      // Toggle pilihan SDG Utama
      const toggleSdg = (id) => {
        setKriteria(prev => {
          const currentSelected = prev.sdgs.selected;
          const index = currentSelected.indexOf(id);
          let newSelected = [];
          if (index > -1) {
            newSelected = currentSelected.filter(item => item !== id);
          } else {
            newSelected = [...currentSelected, id];
          }
          return {
            ...prev,
            sdgs: { ...prev.sdgs, selected: newSelected }
          };
        });
      };

      // Toggle pilihan Kata Kunci SDG
      const toggleKeyword = (kw) => {
        setSelectedKeywords(prev => {
          if (prev.includes(kw)) {
            return prev.filter(item => item !== kw);
          } else {
            return [...prev, kw];
          }
        });
      };

      // Fungsi Copy ke Clipboard
      const copyToClipboard = (text) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch (err) {
          console.error('Gagal menyalin teks', err);
        }
        document.body.removeChild(textArea);
      };

      const getTanggalVariations = (dateStr) => {
        if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return [dateStr];

        if (isNaN(d.getTime())) return [dateStr];

        const monthsInd = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const monthsIndShort = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agt", "Sep", "Okt", "Nov", "Des"];
        const monthsEng = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        
        const day = d.getDate();
        const year = d.getFullYear();
        const monthInd = monthsInd[d.getMonth()];
        const monthIndShort = monthsIndShort[d.getMonth()];
        const monthEng = monthsEng[d.getMonth()];

        return [
          `${day} ${monthInd} ${year}`,
          `${day} ${monthIndShort} ${year}`,
          `${day} ${monthEng} ${year}`,
          `${String(day).padStart(2, '0')}-${String(d.getMonth()+1).padStart(2, '0')}-${year}`,
          dateStr
        ];
      };

  "judul": "Judul Berita Resmi UM Sesuai Format",
  "konten": "Pendahuluan\n...\n\nTujuan\n...\n\nMetodologi\n...\n\nHasil\n...\n\nKontribusi SDG\n...\n\nTantangan dan Rekomendasi\n...",
  "deduksiHasil": {
    "kategoriKegiatan": "Kategori yang Anda tentukan",
    "targetSdgDideteksi": ["Nomor & deskripsi Target SDG spesifik yang dideteksi secara dinamis"],
    "latarBelakang": "Rumusan latar belakang masalah",
    "tujuan": "Rumusan tujuan kegiatan",
    "metodologi": "Metodologi yang dirumuskan",
    "hasilAktual": "Dua data kuantitatif yang dirumuskan",
    "tantangan": "Tantangan yang diidentifikasi",
    "rekomendasi": "Rekomendasi pemecahan masa depan",
    "kutipanDihasilkan": "Teks kalimat kutipan langsung yang Anda gunakan"
  },
  "audit": {
    "skor": 95,
    "analisis": "Analisis singkat kelayakan berita.",
    "kriteriaTerpenuhi": ["Daftar kriteria terpenuhi"],
    "kriteriaBelumTerpenuhi": ["Catatan verifikasi riil"],
    "jumlahKata": 420,
    "jumlahDataKuantitatif": 2,
    "rekomendasi": "Saran penyempurnaan draf"
  }
}`;

        const userQuery = `
NARASI KEGIATAN SINGKAT DARI USER:
"${uraian}"

DATA FISIK KEGIATAN YANG WAJIB ANDA TENUN MASUK KE DALAM NARASI (DI-CHECKLIST OLEH USER):
${dataFisikText}

Silakan deteksi Target SDG secara dinamis, integrasikan seluruh parameter fisik checklist & Kata Kunci SDG terpilih di atas dengan presisi, masukkan/buatkan Kutipan Langsung tokoh tersebut secara eksak, lalu hasilkan respon JSON sesuai skema.`;

        let retries = 5;
        let delay = 1000;
        let success = false;
        let responseData = null;

        while (retries > 0 && !success) {
          try {
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${effectiveApiKey}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: userQuery }] }],
                  systemInstruction: { parts: [{ text: systemPrompt }] },
                  generationConfig: { responseMimeType: "application/json" }
                })
              }
            );

            if (!response.ok) {
              const errData = await response.json().catch(() => ({}));
              throw new Error(errData.error?.message || `HTTP error! status: ${response.status}`);
            }
            const data = await response.json();
            const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (rawText) {
              responseData = JSON.parse(rawText);
              success = true;
            } else {
              throw new Error("Respon kosong dari AI");
            }
          } catch (error) {
            retries--;
            if (retries === 0) {
              setErrorMsg(`Gagal memproses data: ${error.message || 'Periksa API Key atau koneksi Anda.'}`);
              setLoading(false);
              return;
            }
            await new Promise(resolve => setTimeout(resolve, delay));
            delay *= 2;
          }
        }

        if (success && responseData) {
          setBeritaHasil(responseData);
          setAuditHasil(responseData.audit);
          setDeduksiHasil(responseData.deduksiHasil);
        }
        setLoading(false);
      };

      const loadTemplateDemo = () => {
        setUraian("Departemen Teknik Sipil FT UM menyelenggarakan pelatihan kurikulum konstruksi hijau berbasis Building Information Modeling (BIM) bagi guru SMK se-Jawa Timur. Menghadirkan Dr. Kenji Tanaka dari Osaka University guna transfer teknologi material berkelanjutan. Program ini berlangsung selama 3 hari penuh di Malang.");
        setKriteria({
          pelaksana: { aktif: true, value: "Departemen Teknik Sipil" },
          prodi: { aktif: true, value: "S1 Pendidikan Teknik Bangunan" },
          departemen: { aktif: true, value: "Teknik Sipil" },
          fakultas: { aktif: true, value: "Fakultas Teknik" },
          sdgs: { aktif: true, selected: [4, 9, 17] },
          tglMulai: { aktif: true, value: "2026-05-10" },
          tglSelesai: { aktif: true, value: "2026-05-12" },
          jmlPelaksana: { aktif: true, value: "12 dosen dan 8 mahasiswa" },
          jmlPeserta: { aktif: true, value: "85 guru produktif SMK" },
          serviceHours: { aktif: true, value: "32 jam pelatihan" },
          beneficiaries: { aktif: true, value: "Guru produktif SMK bidang konstruksi" },
          location: { aktif: true, value: "Gedung kuliah H5 Kampus Pusat UM, Malang" },
          collaborator: { aktif: true, value: "Dr. Kenji Tanaka", institusi: "Osaka University, Jepang" },
          pemberiKutipan: { 
            aktif: true, 
            mode: "manual",
            nama: "Prof. Dr. Suyono, M.Pd.", 
            afiliasi: "Wakil Rektor I Universitas Negeri Malang", 
            kutipan: "Pelatihan konstruksi hijau ini adalah langkah konkret UM dalam mentransfer teknologi bersih ke tingkat SMK vokasi guna mewujudkan SDGs." 
          }
        });
        setSelectedKeywords(["Pelatihan guru", "Kemitraan pendidikan", "Konstruksi berkelanjutan", "Kemitraan multi-pihak"]);
      };

      const getAvailableKeywords = () => {
        let list = [];
        if (kriteria.sdgs.aktif && kriteria.sdgs.selected) {
          kriteria.sdgs.selected.forEach(sdgId => {
            const keywords = sdgKeywordsMap[sdgId] || [];
            keywords.forEach(kw => {
              if (!list.includes(kw)) list.push(kw);
            });
          });
        }
        return list;
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans">
          {/* HEADER UTAMA */}
          <header className="bg-gradient-to-r from-teal-900 via-emerald-950 to-slate-900 text-white shadow-md py-6 px-4">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-emerald-600/30 rounded-xl border border-emerald-400/30 backdrop-blur-sm">
                  {Cpu && <Cpu className="w-8 h-8 text-emerald-400" />}
                </div>
                <div>
                  <h1 className="text-2xl font-extrabold tracking-tight">Sistem Audit & Pembuat Berita SDGs UM</h1>
                  <p className="text-xs text-emerald-200 mt-0.5">Generator & Evaluator Berita Berbasis Bukti THE dengan Otomatisasi Parameter Cerdas</p>
                </div>
              </div>
              <div className="flex flex-wrap gap-2 items-center">
                <button
                  onClick={() => setShowApiKeyModal(true)}
                  className={`px-3.5 py-2 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 border cursor-pointer ${
                    userApiKey 
                      ? 'bg-emerald-900/60 text-emerald-300 border-emerald-500/50 hover:bg-emerald-800' 
                      : 'bg-amber-500/20 text-amber-300 border-amber-400/50 hover:bg-amber-500/30 animate-pulse'
                  }`}
                >
                  {Key && <Key className="w-4 h-4 text-amber-300" />}
                  <span>{userApiKey ? 'API Key Terpasang' : 'Set Gemini API Key'}</span>
                </button>
                <button 
                  onClick={loadTemplateDemo}
                  className="px-4 py-2 bg-emerald-800 hover:bg-emerald-700 border border-emerald-600 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 text-emerald-50 shadow-sm cursor-pointer"
                >
                  {Sparkles && <Sparkles className="w-4 h-4 text-amber-300" />} Gunakan Contoh Data Kegiatan
                </button>
                <button 
                  onClick={() => {
                    setUraian("");
                    setBeritaHasil("");
                    setAuditHasil(null);
                    setDeduksiHasil(null);
                    setSelectedKeywords([]);
                  }}
                  className="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 text-slate-300 cursor-pointer"
                  title="Reset Semua Input"
                >
                  {RotateCcw && <RotateCcw className="w-5 h-5" />}
                </button>
              </div>
            </div>
          </header>

          {/* MODAL INPUT API KEY */}
          {showApiKeyModal && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
                <div className="flex items-center gap-3 mb-3">
                  <div className="p-2 bg-amber-100 rounded-xl text-amber-700">
                    {Key && <Key className="w-6 h-6" />}
                  </div>
                  <div>
                    <h3 className="text-lg font-bold text-slate-900">Pengaturan Gemini API Key</h3>
                    <p className="text-xs text-slate-500">Kunci ini tersimpan aman di browser Anda (LocalStorage)</p>
                  </div>
                </div>

                <p className="text-xs text-slate-600 mb-4 leading-relaxed">
                  Agar aplikasi dapat bekerja saat di-host di GitHub Pages tanpa mengekspos API Key rahasia ke repositori publik, masukkan API Key Google Gemini AI Anda di bawah ini:

                <div className="space-y-3 mb-5">
                  <input
                    type="password"
                    value={userApiKey}
                    onChange={(e) => saveApiKey(e.target.value)}

                  <div className="flex items-center justify-between text-[11px] text-slate-500">
                    <span>Belum punya API Key?</span>

                      target="_blank"

                <div className="flex justify-end gap-2">

                  >
                    Simpan & Tutup
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* WORKSPACE UTAMA */}
          <main className="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            {/* PANEL KIRI: INPUT & CHECKLIST */}

                </div>
                <p className="text-xs text-slate-500 mb-3 leading-relaxed">

                </p>
                <textarea
                  value={uraian}
                  onChange={(e) => setUraian(e.target.value)}
                  placeholder="Contoh: Departemen Teknik Sipil mengadakan pelatihan pemanfaatan inovasi teknologi bangunan berkelanjutan bagi guru SMK se-Malang Raya..."
                  rows={5}
                  className="w-full p-4 rounded-xl border border-slate-300 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 outline-none text-sm transition-all shadow-inner"
                />
              </div>

              {/* BAGIAN 2: CHECKLIST PARAMETER FISIK */}
              <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80">

                  <div className="flex items-center gap-2">

                      <input

                  {/* Institusi Akademik */}
                  <div className={`p-4 rounded-xl border transition-all ${kriteria.prodi.aktif || kriteria.departemen.aktif || kriteria.fakultas.aktif ? 'bg-emerald-50/30 border-emerald-200' : 'bg-slate-50 border-slate-200 opacity-70'}`}>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <div className="p-2.5 bg-white rounded-lg border border-slate-200">

                        {kriteria.prodi.aktif && (

                          />

                      </div>

                      <div className="p-2.5 bg-white rounded-lg border border-slate-200">
                        <label className="flex items-center gap-2 text-xs font-medium cursor-pointer select-none mb-1">
                          <input 
                            type="checkbox"

                        {kriteria.departemen.aktif && (
                          <input

                      </div>

                      <div className="p-2.5 bg-white rounded-lg border border-slate-200">
                        <label className="flex items-center gap-2 text-xs font-medium cursor-pointer select-none mb-1">
                          <input 
                            type="checkbox" 
                            checked={kriteria.fakultas.aktif}
                            onChange={() => toggleKriteria('fakultas')}
                            className="w-3.5 h-3.5 text-emerald-600 rounded"
                          />
                          <span>Fakultas</span>
                        </label>
                        {kriteria.fakultas.aktif && (
                          <input
                            type="text"
                            value={kriteria.fakultas.value}
                            onChange={(e) => updateKriteriaValue('fakultas', 'value', e.target.value)}
                            className="w-full p-1.5 bg-slate-50 border border-slate-200 rounded text-[11px] outline-none"

                      </div>
                    </div>
                  </div>

                  {/* SDGs Utama */}
                  <div className={`p-3 rounded-xl border transition-all ${kriteria.sdgs.aktif ? 'bg-emerald-50/30 border-emerald-200' : 'bg-slate-50 border-slate-200 opacity-70'}`}>
                    <div className="flex items-center justify-between gap-2 mb-2">

                      {Layers && <Layers className={`w-4 h-4 ${kriteria.sdgs.aktif ? 'text-emerald-600' : 'text-slate-400'}`} />}

                    {kriteria.sdgs.aktif && (

                                className={`flex items-start text-left p-1.5 rounded text-[11px] transition-all border cursor-pointer ${

                  {/* Tanggal */}
                  <div className={`p-3 rounded-xl border transition-all ${kriteria.tglMulai.aktif || kriteria.tglSelesai.aktif ? 'bg-emerald-50/30 border-emerald-200' : 'bg-slate-50 border-slate-200 opacity-70'}`}>

                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div className="p-2 bg-white rounded-lg border border-slate-200">
                        <label className="flex items-center gap-1.5 text-xs font-medium cursor-pointer mb-1">
                          <input 
                            type="checkbox" 
                            checked={kriteria.tglMulai.aktif}
                            onChange={() => toggleKriteria('tglMulai')}
                            className="w-3.5 h-3.5 text-emerald-600 rounded"
                          />
                          <span>Mulai</span>
                        </label>
                        {kriteria.tglMulai.aktif && (

                            value={kriteria.tglMulai.value}
                            onChange={(e) => updateKriteriaValue('tglMulai', 'value', e.target.value)}

                      <div className="p-2 bg-white rounded-lg border border-slate-200">

                          <input 
                            type="checkbox" 
                            checked={kriteria.tglSelesai.aktif}

                            className="w-3.5 h-3.5 text-emerald-600 rounded"

                    <div className="flex items-center justify-between gap-2 mb-2">

                    {kriteria.pemberiKutipan.aktif && (

                          <input
                            type="text"
                            value={kriteria.pemberiKutipan.afiliasi}
                            onChange={(e) => updateKriteriaValue('pemberiKutipan', 'afiliasi', e.target.value)}
                            placeholder="Jabatan/Afiliasi"
                            className="w-full p-2 bg-white rounded-lg border border-slate-200 text-xs outline-none"
                          />
                        </div>

                        {kriteria.pemberiKutipan.mode === "manual" ? (
                          <textarea
                            value={kriteria.pemberiKutipan.kutipan}
                            onChange={(e) => updateKriteriaValue('pemberiKutipan', 'kutipan', e.target.value)}
                            placeholder="Tuliskan kalimat kutipan langsung di sini..."
                            rows={2}
                            className="w-full p-2 bg-white rounded-lg border border-slate-200 text-xs outline-none"
                          />
                        ) : null}
                      </div>
                    )}
                  </div>
                </div>

                {/* Tombol Action */}
                <div className="mt-8">
                  <button
                    type="button"
                    onClick={generateBeritaDenganGemini}
                    disabled={loading}
                    className="w-full py-4 px-6 bg-gradient-to-r from-emerald-600 via-teal-600 to-indigo-700 hover:from-emerald-700 hover:to-indigo-800 text-white rounded-xl font-bold text-base shadow-md transition-all flex items-center justify-center gap-3 cursor-pointer disabled:opacity-50"
                  >
                    {loading ? (
                      <span>Mendeduksi & Memproses Draf Berita...</span>
                    ) : (
                      <>
                        {Cpu && <Cpu className="w-5 h-5 text-amber-300" />}
                        <span>Generate & Jalankan Audit</span>
                      </>
                    )}
                  </button>
                  {errorMsg && (
                    <div className="mt-3 p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg flex items-center gap-2">
                      {AlertTriangle && <AlertTriangle className="w-4 h-4 text-rose-500" />}
                      <span>{errorMsg}</span>
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* PANEL KANAN: PREVIEW & AUDIT */}
            <div className="lg:col-span-6 flex flex-col gap-6">
              {!beritaHasil && !loading && (
                <div className="bg-slate-100 rounded-2xl p-8 border border-slate-200 border-dashed text-center flex flex-col items-center justify-center min-h-[500px]">
                  {Sparkles && <Sparkles className="w-10 h-10 text-emerald-600/60 mb-4" />}
                  <h3 className="text-slate-700 font-bold mb-1">Draf Berita & Analisis SDGs</h3>
                  <p className="text-slate-500 text-xs max-w-md mx-auto leading-relaxed">
                    Tentukan data dasar kegiatan di sebelah kiri, kemudian klik tombol <strong>Generate & Jalankan Audit</strong>.
                  </p>
                </div>
              )}

              {loading && (
                <div className="bg-white rounded-2xl p-8 shadow-sm border border-slate-200 text-center flex flex-col items-center justify-center min-h-[500px]">
                  <div className="w-12 h-12 rounded-full border-4 border-emerald-100 border-t-emerald-600 animate-spin mb-4"></div>
                  <h3 className="text-slate-900 font-bold mb-1">Mendeduksi Parameter SDGs</h3>
                  <p className="text-slate-500 text-xs">Menganalisis narasi dan menyusun naskah berita berstandar THE...</p>
                </div>
              )}

              {beritaHasil && !loading && (
                <div className="space-y-6">
                  {/* DEDUKSI */}
                  {deduksiHasil && (
                    <div className="bg-gradient-to-br from-emerald-950 to-slate-900 text-white rounded-2xl p-6 shadow-md border border-emerald-800/30">
                      <h2 className="text-sm font-bold text-emerald-100 mb-3 flex items-center gap-2">
                        {Cpu && <Cpu className="w-4 h-4 text-emerald-400" />} Parameter Dideduksi AI
                      </h2>
                      <div className="space-y-3 text-xs">
                        <div>
                          <span className="text-[10px] text-emerald-300 font-bold uppercase block">Kategori Kegiatan:</span>
                          <p className="text-slate-200 bg-emerald-900/40 p-2 rounded">{deduksiHasil.kategoriKegiatan}</p>
                        </div>
                        <div>
                          <span className="text-[10px] text-emerald-300 font-bold uppercase block">Target SDG Dideteksi:</span>
                          <div className="flex flex-wrap gap-1 mt-1">
                            {deduksiHasil.targetSdgDideteksi?.map((t, i) => (
                              <span key={i} className="bg-indigo-950 border border-indigo-700/50 p-1.5 rounded text-slate-200 text-[11px] block w-full">{t}</span>
                            ))}
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* AUDIT THE */}
                  {auditHasil && (
                    <div className="bg-slate-900 text-white rounded-2xl p-6 shadow-md border border-slate-800">
                      <div className="flex justify-between items-center mb-3 border-b border-white/10 pb-2">
                        <span className="text-sm font-bold flex items-center gap-2">
                          {CheckCircle && <CheckCircle className="w-4 h-4 text-emerald-400" />} Kepatuhan Standar THE
                        </span>
                        <span className="bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded text-xs font-bold">Skor: {auditHasil.skor}/100</span>
                      </div>
                      <p className="text-xs text-slate-300 italic mb-3">"{auditHasil.analisis}"</p>
                    </div>
                  )}

                  {/* BERITA UTUH */}
                  <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <div className="flex justify-between items-center border-b border-slate-100 pb-3 mb-4">
                      <span className="text-sm font-bold text-slate-900 flex items-center gap-2">
                        {FileCheck && <FileCheck className="w-4 h-4 text-emerald-700" />} Draf Berita Terformat
                      </span>
                      <div className="flex gap-2">
                        <button
                          onClick={() => copyToClipboard(`${beritaHasil.judul}\n\n${beritaHasil.konten}`)}
                          className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 rounded text-slate-600 text-xs flex items-center gap-1 cursor-pointer"
                        >
                          {Copy && <Copy className="w-3.5 h-3.5" />} {copied ? 'Tersalin!' : 'Salin'}
                        </button>
                        <button
                          onClick={downloadAsDoc}
                          className="px-2.5 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded text-xs font-semibold flex items-center gap-1 cursor-pointer"
                        >
                          {FileDown && <FileDown className="w-3.5 h-3.5" />} Download .doc
                        </button>
                      </div>
                    </div>

                    <h1 
                      className="text-base font-extrabold text-slate-900 leading-snug border-l-4 border-emerald-600 pl-2.5 mb-4"
                      dangerouslySetInnerHTML={{ __html: getHighlightedText(beritaHasil.judul, false) }}
                    />

                    <div 
                      className="text-xs text-slate-700 leading-relaxed space-y-4 whitespace-pre-line bg-slate-50 p-4 rounded-xl border border-slate-100 font-normal mb-4"
                      dangerouslySetInnerHTML={{ __html: getHighlightedText(beritaHasil.konten, false) }}
                    />

                    {/* Legenda Highlight */}
                    <div className="bg-slate-100 p-3 rounded-xl border border-slate-200 text-[11px]">
                      <span className="font-bold text-slate-800 block mb-1">Legenda Highlight Parameter:</span>
                      <div className="flex flex-wrap gap-1">
                        {Object.keys(highlightConfig).map(key => {
                          const item = highlightConfig[key];
                          return (
                            <span key={key} className="px-1.5 py-0.5 rounded text-[10px] font-bold border" style={{ backgroundColor: item.bg, color: item.text, borderColor: item.border }}>
                              {item.label}
                            </span>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
